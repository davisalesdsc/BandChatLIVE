name: Benchmark do motor

# Roda num push para a branch "bench" (ou à mão em Actions): mede modelos,
# threads, flash attention e janela do encoder num Mac Intel e no Linux.
on:
  push:
    branches: [ bench ]
  workflow_dispatch:

env:
  MODELS: "ggml-tiny-q5_1.bin ggml-base-q5_1.bin ggml-base-q8_0.bin ggml-base.bin ggml-small-q5_1.bin"

jobs:
  mac-intel:
    runs-on: macos-15-intel
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Compilar
        run: |
          sysctl -n machdep.cpu.brand_string; sysctl -n hw.physicalcpu hw.logicalcpu
          cmake -S . -B build -G Xcode -DTAV_OSX_ARCH=x86_64 -DTAV_BUILD_TESTS=ON
          cmake --build build --config Release --target TavBench -- -quiet
      - uses: actions/cache@v4
        with: { path: modelos, key: "bench-${{ env.MODELS }}" }
      - run: bash installer/baixar-modelos.sh modelos $MODELS
      - name: Benchmark (flash desligado)
        run: TAV_FLASH=0 ./build/TavBench_artefacts/Release/TavBench tests/audio/teste.wav $(for m in $MODELS; do echo modelos/$m; done)
      - name: Benchmark (flash ligado)
        run: TAV_FLASH=1 ./build/TavBench_artefacts/Release/TavBench tests/audio/teste.wav $(for m in $MODELS; do echo modelos/$m; done)

  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ninja-build libasound2-dev libfreetype-dev libfontconfig1-dev libx11-dev \
            libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libcurl4-openssl-dev
      - run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DTAV_BUILD_TESTS=ON
          cmake --build build --target TavBench
      - uses: actions/cache@v4
        with: { path: modelos, key: "bench-${{ env.MODELS }}" }
      - run: bash installer/baixar-modelos.sh modelos $MODELS
      - name: Benchmark (flash desligado)
        run: TAV_FLASH=0 ./build/TavBench_artefacts/Release/TavBench tests/audio/teste.wav $(for m in $MODELS; do echo modelos/$m; done)
      - name: Benchmark (flash ligado)
        run: TAV_FLASH=1 ./build/TavBench_artefacts/Release/TavBench tests/audio/teste.wav $(for m in $MODELS; do echo modelos/$m; done)
