name: Build e instaladores

# A cada push: compila, testa e gera os instaladores (aba Actions > Artifacts).
# Ao criar uma tag v* (ex.: v0.2): também publica uma Release com os dois instaladores.
on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

env:
  BUILD_TYPE: Release
  # modelos que vão dentro do instalador do Windows (no Mac: por arquitetura, abaixo)
  MODELS: "ggml-base-q8_0.bin ggml-small-q5_1.bin"
  MODELS_URL: "https://huggingface.co/ggerganov/whisper.cpp/resolve/main"

jobs:
  # ---------------------------------------------------------------------------
  # macOS: um instalador por tipo de Mac, cada um compilado, testado (com o
  # Whisper de verdade), empacotado e instalado NA PRÓPRIA arquitetura
  # ---------------------------------------------------------------------------
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
            label: AppleSilicon
            models: "ggml-base-q5_1.bin ggml-small-q5_1.bin"
          - arch: x86_64
            runner: macos-15-intel
            label: Intel
            models: "ggml-base-q8_0.bin"
    runs-on: ${{ matrix.runner }}
    env:
      HAS_SIGNING: ${{ secrets.MACOS_CERT_P12_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Configurar
        run: |
          sysctl -n machdep.cpu.brand_string || true
          cmake -S . -B build -G Xcode -DTAV_OSX_ARCH=${{ matrix.arch }} -DTAV_BUILD_TESTS=ON
      - name: Compilar
        run: cmake --build build --config $BUILD_TYPE --target BandChatLIVE_VST3 BandChatLIVE_AU BandChatLIVE_Standalone TavTests HostTest -- -quiet

      - name: Modelos de voz (cache)
        uses: actions/cache@v4
        with:
          path: modelos
          key: modelos-${{ matrix.models }}
      - name: Baixar modelos
        run: bash installer/baixar-modelos.sh modelos ${{ matrix.models }}
      - name: Testes do motor + Whisper de verdade
        run: |
          ./build/TavTests_artefacts/$BUILD_TYPE/TavTests tests/audio/teste.wav "modelos/$(echo '${{ matrix.models }}' | cut -d' ' -f1)"
          echo "--- log do motor"; tail -20 ~/Library/Application\ Support/BandChatLIVE/transcritor.log 2>/dev/null || true

      - name: Juntar os bundles
        run: |
          mkdir -p out
          for f in VST3/BandChatLIVE.vst3 AU/BandChatLIVE.component Standalone/BandChatLIVE.app; do
            ditto "build/BandChatLIVE_artefacts/$BUILD_TYPE/$f" "out/$(basename "$f")"
            lipo -info "out/$(basename "$f")/Contents/MacOS/BandChatLIVE"
          done

      - name: Importar certificados (só se configurados)
        if: env.HAS_SIGNING == 'true'
        env:
          P12: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KC="$RUNNER_TEMP/sign.keychain-db"; KCPASS="$(uuidgen)"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KCPASS" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPASS" "$KC"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple: -k "$KCPASS" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          echo "APP_IDENTITY=$(security find-identity -v -p codesigning "$KC" | grep -o '"Developer ID Application[^"]*"' | head -1 | tr -d '"')" >> $GITHUB_ENV
          echo "MAC_INSTALLER_IDENTITY=$(security find-identity -v "$KC" | grep -o '"Developer ID Installer[^"]*"' | head -1 | tr -d '"')" >> $GITHUB_ENV

      - name: Assinar os bundles
        run: |
          set -e
          if [ -n "${APP_IDENTITY:-}" ]; then
            echo "Assinando com $APP_IDENTITY (hardened runtime)"
            for b in out/*.vst3 out/*.component; do
              codesign --force --deep --options runtime --timestamp --sign "$APP_IDENTITY" "$b"
            done
            codesign --force --deep --options runtime --timestamp \
                     --entitlements installer/macos/app.entitlements --sign "$APP_IDENTITY" out/*.app
          else
            echo "Sem certificado: assinatura ad-hoc (o Mac vai pedir confirmação ao abrir o instalador)"
            for b in out/*; do codesign --force --deep --sign - "$b"; done
          fi
          for b in out/*; do codesign --verify --deep --strict "$b"; done

      - name: Montar o .pkg
        run: |
          VERSION="$(tr -d '[:space:]' < VERSAO)"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "PKG=BandChatLIVE-$VERSION-macOS-${{ matrix.label }}.pkg" >> $GITHUB_ENV
          bash installer/macos/build-pkg.sh out modelos "$VERSION" ${{ matrix.arch }} "BandChatLIVE-$VERSION-macOS-${{ matrix.label }}.pkg"

      - name: Notarizar (só se configurado)
        if: env.HAS_SIGNING == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          xcrun notarytool submit "$PKG" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple "$PKG"

      - name: Testar a instalação
        run: |
          set -e
          sudo installer -pkg "$PKG" -target /
          for p in "/Library/Audio/Plug-Ins/VST3/BandChatLIVE.vst3" \
                   "/Library/Audio/Plug-Ins/Components/BandChatLIVE.component" \
                   "/Applications/BandChatLIVE.app" \
                   "/Library/Application Support/BandChatLIVE/Desinstalar BandChatLIVE.command"; do
            test -e "$p" && echo "ok: $p"
          done
          for m in ${{ matrix.models }}; do test -s "/Library/Application Support/BandChatLIVE/modelos/$m" && echo "ok: modelo $m"; done
          lipo -info "/Library/Audio/Plug-Ins/VST3/BandChatLIVE.vst3/Contents/MacOS/BandChatLIVE"
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          sleep 3
          auval -v aufx BcLv DvSl          # validação oficial da Apple, no AU já instalado

      - name: Host de teste com o AU e o VST3 instalados (áudio entrando, frases, canais)
        run: |
          rm -rf ~/Library/Application\ Support/BandChatLIVE/Logs
          TAV_DEMO=1 ./build/HostTest_artefacts/$BUILD_TYPE/HostTest "/Library/Audio/Plug-Ins/Components/BandChatLIVE.component" tests/audio/teste.wav
          TAV_DEMO=1 ./build/HostTest_artefacts/$BUILD_TYPE/HostTest "/Library/Audio/Plug-Ins/VST3/BandChatLIVE.vst3" tests/audio/teste.wav
          echo "--- log do motor"; tail -15 ~/Library/Application\ Support/BandChatLIVE/transcritor.log || true

      - uses: actions/upload-artifact@v4
        with:
          name: Instalador-macOS-${{ matrix.label }}
          path: BandChatLIVE-*-macOS-*.pkg

  # ---------------------------------------------------------------------------
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configurar
        run: cmake -S . -B build -A x64 -DTAV_BUILD_TESTS=ON   # usa o Visual Studio que o runner tiver
      - name: Compilar
        run: cmake --build build --config Release --target BandChatLIVE_VST3 BandChatLIVE_Standalone TavTests -- /m /v:minimal
      - name: Testes do motor
        run: '& "build/TavTests_artefacts/Release/TavTests.exe" tests/audio/teste.wav'
      - name: Plugin não depende do Visual C++ Redistributable
        shell: pwsh
        run: |
          $dll = "build/BandChatLIVE_artefacts/Release/VST3/BandChatLIVE.vst3/Contents/x86_64-win/BandChatLIVE.vst3"
          $txt = [System.Text.Encoding]::ASCII.GetString([System.IO.File]::ReadAllBytes($dll))
          if ($txt -match '(?i)(vcruntime|msvcp)1\d\d\.dll') { throw "o plugin depende de $($Matches[0])" }
          "ok: runtime do Visual C++ embutido"

      - name: Modelos de voz (cache)
        uses: actions/cache@v4
        with:
          path: modelos
          key: modelos-${{ env.MODELS }}
      - name: Baixar modelos
        shell: bash
        run: bash installer/baixar-modelos.sh modelos $MODELS

      - name: Montar o instalador (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          $version = (Get-Content VERSAO -Raw).Trim()
          "VERSION=$version" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item -Recurse "build/BandChatLIVE_artefacts/Release/VST3/BandChatLIVE.vst3" out/
          Copy-Item "build/BandChatLIVE_artefacts/Release/Standalone/BandChatLIVE.exe" out/
          Copy-Item README.md out/LEIA-ME.md
          & $iscc /Q "/DAppVersion=$version" "/DSrcDir=$PWD\out" "/DModelsDir=$PWD\modelos" "/DOutDir=$PWD" installer/windows/BandChatLIVE.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC falhou" }

      - name: Testar instalar e desinstalar
        shell: pwsh
        run: |
          $setup = Get-ChildItem "BandChatLIVE-*-Windows-Setup.exe" | Select-Object -First 1
          $p = Start-Process $setup.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/LOG=install.log' -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content install.log -Tail 30; throw "instalação falhou ($($p.ExitCode))" }
          $files = @(
            "$env:CommonProgramFiles\VST3\BandChatLIVE.vst3\Contents\x86_64-win\BandChatLIVE.vst3",
            "$env:ProgramFiles\BandChatLIVE\BandChatLIVE.exe",
            "$env:ProgramData\BandChatLIVE\modelos\ggml-base-q8_0.bin")
          foreach ($f in $files) { if (-not (Test-Path $f)) { throw "faltando: $f" }; "ok: $f" }
          Start-Process "$env:ProgramFiles\BandChatLIVE\unins000.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait
          for ($i = 0; $i -lt 30 -and (Test-Path $files[0]); $i++) { Start-Sleep 1 }
          if (Test-Path $files[0]) { throw "a desinstalação deixou o plugin para trás" }
          "ok: desinstalado"

      - uses: actions/upload-artifact@v4
        with:
          name: Instalador-Windows
          path: BandChatLIVE-*-Windows-Setup.exe

  # ---------------------------------------------------------------------------
  # Linux: carrega o VST3 num host de teste (estado, várias instâncias, fluxo)
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Textos com acento convertidos de UTF-8
        run: python3 tests/checar-acentos.py Source
      - name: Dependências
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ninja-build libasound2-dev libjack-jackd2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev \
            libglu1-mesa-dev mesa-common-dev libcurl4-openssl-dev xvfb
      - name: Compilar
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DTAV_BUILD_TESTS=ON
          cmake --build build
      - name: Testes do motor + Whisper de verdade (CPU)
        run: |
          bash installer/baixar-modelos.sh modelos ggml-base-q8_0.bin
          ./build/TavTests_artefacts/Release/TavTests tests/audio/teste.wav modelos/ggml-base-q8_0.bin
      - name: Host de teste (VST3, modo demo)
        run: |
          export DISPLAY=:99; Xvfb :99 -screen 0 1280x900x24 & sleep 1
          TAV_DEMO=1 ./build/HostTest_artefacts/Release/HostTest "build/BandChatLIVE_artefacts/Release/VST3/BandChatLIVE.vst3" tests/audio/teste.wav

  # ---------------------------------------------------------------------------
  release:
    # push na main (ou tag v*) com tudo passando: cria/atualiza a Release da
    # versão escrita em VERSAO. Versão nova = mudar o VERSAO.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [ macos, windows, linux ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Versão
        run: echo "VERSION=$(tr -d '[:space:]' < VERSAO)" >> $GITHUB_ENV
      - uses: actions/download-artifact@v4
        with: { name: Instalador-macOS-AppleSilicon, path: dist }
      - uses: actions/download-artifact@v4
        with: { name: Instalador-macOS-Intel, path: dist }
      - uses: actions/download-artifact@v4
        with: { name: Instalador-Windows, path: dist }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: BandChatLIVE ${{ env.VERSION }}
          make_latest: true
          overwrite_files: true
          files: dist/*
          body: |
            **Mac com Apple Silicon** (M1, M2, M3, M4...): baixe o `macOS-AppleSilicon.pkg`.
            **Mac Intel**: baixe o `macOS-Intel.pkg`. (Não sabe? Menu  › Sobre Este Mac: "Chip Apple" ou "Processador Intel".)
            **Windows** (10/11, 64 bits): baixe o `Setup.exe` e dê dois cliques.

            Instala os plugins VST3 e AU (Mac), o app sem DAW e os modelos de voz Rápido e Equilibrado.

            Primeira vez (instalador ainda sem assinatura):
            - macOS: se aparecer "desenvolvedor não identificado", vá em Ajustes do Sistema › Privacidade e Segurança › **Abrir Mesmo Assim**.
            - Windows: em "O Windows protegeu o computador", clique em **Mais informações** › **Executar assim mesmo**.
